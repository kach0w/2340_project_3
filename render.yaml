# Render Blueprint: New > Blueprint > pick this repo. Creates the web app
# and a Postgres database, and wires DATABASE_URL between them.
databases:
  - name: disasterbot-db
    plan: free
    databaseName: disasterbot
    user: disasterbot

services:
  - type: web
    name: disasterbot
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn disasterbot.wsgi:application --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: disasterbot-db
          property: connectionString
      # Entered in the dashboard when the blueprint is created:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODELS
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
