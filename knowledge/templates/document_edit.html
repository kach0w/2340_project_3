{% extends 'base.html' %}
{% block title %}Edit {{ document.title }}{% endblock %}
{% block content %}
<a href="{% url 'knowledge.document_detail' document.id %}">&larr; Back</a>
<h2 class="mt-2">Edit document</h2>
<p class="text-muted">Saving re-cleans and re-chunks the text, so the chatbot uses the new version right away.</p>
<form method="POST">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-link" href="{% url 'knowledge.document_detail' document.id %}">Cancel</a>
</form>
{% endblock %}
